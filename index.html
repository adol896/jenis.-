<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant "Genis" & Multi-Lang SuperChat & Wiki Overlay</title>
    <style>
      /* ベーススタイル */
      html, body {
          margin: 0; padding: 0; width: 100%; height: 100%;
          background-color: #00FF00; overflow: hidden;
          font-family: 'Helvetica Neue', Arial, sans-serif; color: #ffffff;
      }

      /* [1] AI Assistant (Genis) UI */
      #assistant-container {
          position: absolute; bottom: -20px; left: 10px;
          display: flex; flex-direction: column; align-items: center; z-index: 10;
          background: transparent !important;
      }
      #avatar-frame {
          width: 360px; height: 200px; overflow: hidden;
          position: relative; background: transparent !important;
          transition: opacity 0.3s ease;
          display: flex; justify-content: center; align-items: center;
      }
      #avatar-orb {
          width: 110px; height: 110px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #ffffff, #00f3ff 45%, #0066ff 75%, #001133 100%);
          box-shadow: 0 0 25px #00f3ff, 0 0 50px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
          position: absolute; top: 45%; left: 50%;
          transform: translate(-50%, -50%) scale(1);
          transition: transform 0.15s ease, box-shadow 0.15s ease;
          animation: orb-idle 3s infinite ease-in-out;
      }
      @keyframes orb-idle {
          0%, 100% {
              transform: translate(-50%, -50%) scale(1);
              box-shadow: 0 0 20px #00f3ff, 0 0 40px rgba(0, 243, 255, 0.5);
          }
          50% {
              transform: translate(-50%, -50%) scale(1.06);
              box-shadow: 0 0 35px #00f3ff, 0 0 60px rgba(0, 243, 255, 0.8);
          }
      }
      #avatar-orb.speaking-pulse {
          transform: translate(-50%, -50%) scale(1.22);
          box-shadow: 0 0 45px #00f3ff, 0 0 85px #00f3ff, inset 0 0 25px #ffffff;
      }
      #ai-status-msg {
          font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
          color: rgba(255, 255, 255, 0.7); text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top: 4px;
          transition: opacity 0.3s ease;
      }
      .controls-row {
          display: flex; gap: 8px; margin-top: 10px; margin-bottom: 25px;
      }
      .ui-btn {
          background: rgba(15, 20, 35, 0.85); border: 1px solid #00f3ff; color: #00f3ff;
          border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: bold;
          letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
          transition: all 0.2s ease; pointer-events: auto;
      }
      .ui-btn:hover {
          background: #00f3ff; color: #0d1117; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      }
      .element-hide { opacity: 0 !important; pointer-events: none !important; }

      #ai-subtitle-box {
          position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
          background: rgba(6, 10, 22, 0.85);
          border-left: 4px solid #00f3ff; border-radius: 0 8px 8px 0;
          padding: 14px 24px; font-size: 22px; font-weight: bold;
          width: 560px; text-align: center; line-height: 1.4;
          box-shadow: 0 8px 24px rgba(0,0,0,0.4);
          opacity: 0; transform: translate(-50%, 10px);
          transition: opacity 0.2s ease-out, transform 0.2s ease-out;
          pointer-events: none; word-break: break-word; z-index: 20;
      }
      #ai-subtitle-box.active { opacity: 1; transform: translate(-50%, 0); }

      /* [2] カットイン・スパチャ演出 UI */
      #phrase-cutin-box {
          position: absolute; top: 45%; left: 50%;
          width: 90%; max-width: 600px; height: 110px;
          display: flex; align-items: center; justify-content: center;
          z-index: 50; pointer-events: none;
          background: repeating-linear-gradient(90deg, #3d2314, #3d2314 4px, #2b180d 4px, #2b180d 8px),
                      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
          background-blend-mode: multiply;
          border: 5px solid #1a0f08; border-radius: 4px;
          box-shadow: 0 0 30px #ff6600, 0 0 60px #8000ff, inset 0 0 20px rgba(0, 0, 0, 0.8);
          transform: translate(100vw, -50%) skewX(-10deg); opacity: 0; transition: none;
      }
      #phrase-cutin-box.slide-in {
          opacity: 1; transform: translate(-50%, -50%) skewX(-10deg);
          transition: transform 0.25s cubic-bezier(0.075, 0.82, 0.165, 1), opacity 0.15s ease-out;
      }
      #phrase-cutin-box.slide-out {
          opacity: 0; transform: translate(-150vw, -50%) skewX(-10deg);
          transition: transform 0.2s ease-in, opacity 0.15s ease-in;
      }
      #phrase-text-content {
          font-size: 38px; font-weight: 900; font-family: 'Impact', 'Arial Black', sans-serif;
          letter-spacing: 6px; color: #ff9900; text-shadow: 0 0 8px #000, 0 0 20px #8000ff, 2px 2px 2px #3a0000;
      }
      @media (min-width: 768px) {
          #phrase-text-content { font-size: 58px; letter-spacing: 10px; }
      }

      #sc-popup-box {
          position: absolute; top: 45%; left: 50%;
          transform: translate(-50%, -30%);
          background: linear-gradient(135deg, #ff4e50, #f9d423);
          border: 4px solid #ffffff; border-radius: 16px;
          padding: 14px 28px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(255, 215, 0, 0.8);
          z-index: 60; pointer-events: none; opacity: 0;
          box-sizing: border-box; max-width: 85%;
          transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      }
      #sc-popup-box.show {
          transform: translate(-50%, -50%); opacity: 1;
      }
      #sc-text-content {
          font-size: 26px; font-weight: 900; color: #ffffff;
          text-shadow: 2px 2px 6px rgba(0,0,0,0.5), 0 0 10px rgba(255,255,255,0.4);
          white-space: nowrap; text-align: center;
      }
      @media (min-width: 768px) {
          #sc-popup-box { padding: 22px 45px; border-width: 5px; }
          #sc-text-content { font-size: 42px; }
      }

      #canvas-confetti {
          position: absolute; top: 0; left: 0;
          width: 100%; height: 100%; z-index: 70; pointer-events: none;
      }
    </style>

    <!-- データファイルの読み込み[span_1](start_span)[span_1](end_span) -->
    <script src="data.js"></script>
    <script src="data2.js"></script>
    <script src="kuromoji.js"></script>
  </head>
  <body>
    <canvas id="canvas-confetti"></canvas>

    <div id="assistant-container">
      <div id="avatar-frame">
        <div id="avatar-orb"></div>
      </div>
      <div id="ai-status-msg">MUTED</div>
      <div class="controls-row">
        <button id="toggle-lang-btn" class="ui-btn">LANG: JA</button>
        <button id="toggle-avatar-btn" class="ui-btn">AVATAR HIDE</button>
      </div>
    </div>

    <div id="ai-subtitle-box">...</div>

    <div id="phrase-cutin-box">
      <div id="phrase-text-content"></div>
    </div>

    <div id="sc-popup-box">
      <div id="sc-text-content">ありがとうございます！</div>
    </div>

    <script>
      // =========================================================
      // Kuromoji 初期化[span_2](start_span)[span_2](end_span)
      // =========================================================
      let tokenizerInstance = null;

      if (typeof kuromoji !== 'undefined') {
        kuromoji.builder({ dicPath: "./dict/" }).build((err, tokenizer) => {
          if (err) {
            console.error("Kuromoji 辞書のロードに失敗しました:", err);
            return;
          }
          tokenizerInstance = tokenizer;
          console.log("Kuromoji 辞書のロードが完了しました！");
        });
      }

      // =========================================================
      // データの統合処理
      // =========================================================
      const rawData1 = window.AIData1 || window.AIData || {};
      const rawData2 = window.AIData2 || {};

      const aiData = {
        patternDict: {
          ja: [...(rawData1.patternDict?.ja || []), ...(rawData2.patternDict?.ja || [])],
          en: [...(rawData1.patternDict?.en || []), ...(rawData2.patternDict?.en || [])]
        },
        oncePhrases: {
          ja: [...(rawData1.oncePhrases?.ja || []), ...(rawData2.oncePhrases?.ja || [])],
          en: [...(rawData1.oncePhrases?.en || []), ...(rawData2.oncePhrases?.en || [])]
        },
        loopPhrases: {
          ja: [...(rawData1.loopPhrases?.ja || []), ...(rawData2.loopPhrases?.ja || [])],
          en: [...(rawData1.loopPhrases?.en || []), ...(rawData2.loopPhrases?.en || [])]
        },
        silencePhrases: {
          ja: [...(rawData1.silencePhrases?.ja || []), ...(rawData2.silencePhrases?.ja || [])],
          en: [...(rawData1.silencePhrases?.en || []), ...(rawData2.silencePhrases?.en || [])]
        }
      };

      const defaultOncePhrases = {
        ja: [
          "この1週間の中で、一番「美味しかったなぁ」って思った食べ物は何ですか？",
          "ここ1ヶ月の間で、買って良かった便利グッズやアイテムって何かありましたか？",
          "最近コンビニやスーパーで見かけて、つい買っちゃった新商品ってありますか？"
        ],
        en: [
          "What was the best food you ate this past week?",
          "Have you bought anything really useful or fun in the last month?"
        ]
      };

      const defaultLoopPhrases = {
        ja: [
          "いい雰囲気ですね。このまったりした空気、とても落ち着きます。",
          "画面の向こうの皆さんも、お茶でも飲みながらのんびり見ていってくださいね。",
          "今日もマイペースに楽しんでいきましょう。"
        ],
        en: [
          "I really love this relaxed atmosphere. It's so cozy here.",
          "Feel free to grab a drink and get comfortable, everyone!"
        ]
      };

      const oncePhrases = {
        ja: aiData.oncePhrases.ja.length > 0 ? aiData.oncePhrases.ja : defaultOncePhrases.ja,
        en: aiData.oncePhrases.en.length > 0 ? aiData.oncePhrases.en : defaultOncePhrases.en
      };

      const loopPhrases = {
        ja: aiData.loopPhrases.ja.length > 0 ? aiData.loopPhrases.ja : defaultLoopPhrases.ja,
        en: aiData.loopPhrases.en.length > 0 ? aiData.loopPhrases.en : defaultLoopPhrases.en
      };

      const langConfig = {
        ja: {
          recognitionLang: 'ja-JP',
          scDefaultText: "ありがとうございます！",
          scKeywords: ["スパチャ", "スーパーチャット", "ありがとうございまーす", "ありがとうございます", "感謝"],
          cutInRules: [
            { keywords: ["ここだ"], text: "ここだ！" },
            { keywords: ["ここで決める", "これで決める"], text: "これで決める！" }
          ]
        },
        en: {
          recognitionLang: 'en-US',
          scDefaultText: "THANK YOU SO MUCH!",
          scKeywords: ["super chat", "superchat", "thank you", "thanks for the support", "thanks"],
          cutInRules: [
            { keywords: ["this is it", "here goes", "now"], text: "THIS IS IT!" },
            { keywords: ["finish this", "let's do this", "take this"], text: "LET'S DO THIS!" }
          ]
        }
      };

      const sePlayer = new Audio('./' + encodeURIComponent("剣を抜く.mp3"));
      sePlayer.volume = 0.7;

      let isAudioUnlocked = false;

      function unlockAudio() {
        if (isAudioUnlocked) return;
        sePlayer.volume = 0;
        sePlayer.play().then(() => {
          sePlayer.pause();
          sePlayer.currentTime = 0;
          sePlayer.volume = 0.7;
          isAudioUnlocked = true;
          isForceMuted = false;
          aiStatusMsg.innerText = "STANDBY";
        }).catch((err) => {});
      }

      function playSuperChatSynthSE() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') { ctx.resume(); }
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(1.6, now);
        masterGain.connect(ctx.destination);

        const bellFreqs = [523.25, 659.25, 783.99, 1046.5];
        bellFreqs.forEach((freq, index) => {
          const timeOffset = index * 0.05;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = index % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now + timeOffset);
          gain.gain.setValueAtTime(0.35, now + timeOffset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.5);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now + timeOffset);
          osc.stop(now + timeOffset + 0.55);
        });
      }

      let isForceMuted = true;
      let isWaitingPermissionResponse = false;

      let silenceTimer = null;
      const SILENCE_LIMIT = 20 * 1000;

      function resetSilenceTimer() {
        if (isForceMuted) return;
        if (silenceTimer) clearTimeout(silenceTimer);
        silenceTimer = setTimeout(triggerSilenceTalk, SILENCE_LIMIT);
      }

      function stopSilenceTimer() {
        if (silenceTimer) clearTimeout(silenceTimer);
      }

      function triggerSilenceTalk() {
        if (isForceMuted || isSpeaking) {
          resetSilenceTimer();
          return;
        }
        isAutomaticTalk = true;
        const silenceList = aiData.silencePhrases?.[currentLang] || [];
        if (silenceList.length > 0 && Math.random() < 0.5) {
          const randomIndex = Math.floor(Math.random() * silenceList.length);
          runAssistantVoice(silenceList[randomIndex], currentLang);
        } else {
          const nextText = getNextText();
          if (nextText) { runAssistantVoice(nextText, currentLang); }
        }
      }

      async function executePhraseCutIn(text) {
        if (isForceMuted) return;
        const cutInBox = document.getElementById('phrase-cutin-box');
        const cutInText = document.getElementById('phrase-text-content');
        cutInText.innerText = text;
        cutInBox.classList.remove('slide-in', 'slide-out');
        void cutInBox.offsetWidth;
        cutInBox.classList.add('slide-in');
        try {
          sePlayer.currentTime = 0;
          await sePlayer.play();
        } catch (audioErr) {}
        setTimeout(() => {
          cutInBox.classList.remove('slide-in');
          cutInBox.classList.add('slide-out');
          setTimeout(() => { cutInBox.classList.remove('slide-out'); }, 300);
        }, 3000);
      }

      function triggerSuperChatEffects() {
        if (isForceMuted) return;
        const scBox = document.getElementById('sc-popup-box');
        scBox.classList.add('show');
        fireConfetti();
        setTimeout(() => { playSuperChatSynthSE(); }, 50);
        setTimeout(() => { scBox.classList.remove('show'); }, 4000);
      }

      const canvas = document.getElementById('canvas-confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      let particles = [];
      let animatingConfetti = false;

      function fireConfetti() {
        const colors = ['#ff4e50', '#f9d423', '#00f3ff', '#ffffff', '#ff00ff'];
        particles = [];
        for (let i = 0; i < 120; i++) {
          particles.push({
            x: canvas.width / 2, y: canvas.height / 2 + 50,
            r: Math.random() * 6 + 4,
            dx: Math.random() * 30 - 15,
            dy: Math.random() * -20 - 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            tilt: Math.floor(Math.random() * 10) - 10,
            tiltAngle: 0,
            tiltAngleInc: (Math.random() * 0.07) + 0.05
          });
        }
        if (!animatingConfetti) animateConfetti();
      }

      function animateConfetti() {
        animatingConfetti = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
          p.tiltAngle += p.tiltAngleInc;
          p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
          p.x += Math.sin(p.tiltAngle) * 2;
          p.dy += 0.4;
          p.x += p.dx;
          p.y += p.dy;
          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
          ctx.stroke();
          if (p.y > canvas.height) { particles.splice(index, 1); }
        });
        if (particles.length > 0) {
          requestAnimationFrame(animateConfetti);
        } else {
          animatingConfetti = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      let isSpeaking = false;
      let currentLang = 'ja';
      const synthesizer = window.speechSynthesis;
      let availableVoices = [];

      let isEchoWikiLocked = false;
      let isAutomaticTalk = false;

      // =========================================================
      // ゼルダ & モンハン 攻略Wiki (Fandom MediaWiki) 連携機能
      // =========================================================
      const wikiRegistry = {
        "ゼルダ": "zelda.fandom.com",
        "ゼルダの伝説": "zelda.fandom.com",
        "モンハン": "monsterhunter.fandom.com",
        "モンスターハンター": "monsterhunter.fandom.com"
      };

      let isWaitingWikiChoice = false;
      let pendingWikiResults = [];

      async function searchGameWiki(inputText) {
        let targetDomain = "zelda.fandom.com";
        
        for (const [keyword, domain] of Object.entries(wikiRegistry)) {
          if (inputText.includes(keyword)) {
            targetDomain = domain;
            break;
          }
        }

        const cleanQuery = inputText
          .replace(/ゼルダの伝説|ゼルダ|モンスターハンター|モンハン|の攻略|の図鑑|を調べて|について調べて|について/g, "")
          .trim() || inputText;

        const apiUrl = `https://${targetDomain}/api.php?action=query&list=search&srsearch=${encodeURIComponent(cleanQuery)}&format=json&origin=*`;

        try {
          aiStatusMsg.innerText = "SEARCHING";
          const response = await fetch(apiUrl);
          const data = await response.json();
          aiStatusMsg.innerText = "STANDBY";
          return data.query?.search || [];
        } catch (error) {
          aiStatusMsg.innerText = "STANDBY";
          console.warn("Wiki API Error:", error);
          return [];
        }
      }

      function loadVoices() {
        if (synthesizer) { availableVoices = synthesizer.getVoices(); }
      }
      loadVoices();
      if (synthesizer && synthesizer.onvoiceschanged !== undefined) {
        synthesizer.onvoiceschanged = loadVoices;
      }

      const avatarOrb = document.getElementById('avatar-orb');
      const aiStatusMsg = document.getElementById('ai-status-msg');
      const aiSubtitleBox = document.getElementById('ai-subtitle-box');
      const toggleBtn = document.getElementById('toggle-avatar-btn');
      const toggleLangBtn = document.getElementById('toggle-lang-btn');
      const avatarFrame = document.getElementById('avatar-frame');

      let orbPulseInterval = null;
      const currentLoopDecks = { ja: [], en: [] };
      const ONCE_PHRASE_CHANCE = 0.3;

      function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function getNextText() {
        const lang = currentLang;
        const hasOnce = oncePhrases[lang] && oncePhrases[lang].length > 0;
        const rollChance = Math.random() < ONCE_PHRASE_CHANCE;
        if (hasOnce && rollChance) {
          const index = Math.floor(Math.random() * oncePhrases[lang].length);
          const selectedText = oncePhrases[lang][index];
          oncePhrases[lang].splice(index, 1);
          return selectedText;
        }
        if (currentLoopDecks[lang].length === 0) {
          currentLoopDecks[lang] = shuffleArray(loopPhrases[lang]);
        }
        return currentLoopDecks[lang].pop();
      }

      toggleLangBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        currentLang = (currentLang === 'ja') ? 'en' : 'ja';
        toggleLangBtn.innerText = "LANG: " + currentLang.toUpperCase();
        document.getElementById('sc-text-content').innerText = langConfig[currentLang].scDefaultText;
        updateSpeechRecognitionLang();
      });

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        const isHidden = avatarFrame.classList.toggle('element-hide');
        aiStatusMsg.classList.toggle('element-hide');
        toggleBtn.innerText = isHidden ? "AVATAR SHOW" : "AVATAR HIDE";
      });

      function updateAvatarState() {
        clearInterval(orbPulseInterval);
        if (isSpeaking) {
          let isHighGlow = false;
          orbPulseInterval = setInterval(() => {
            isHighGlow = !isHighGlow;
            if (isHighGlow) { avatarOrb.classList.add('speaking-pulse'); }
            else { avatarOrb.classList.remove('speaking-pulse'); }
          }, 160);
        } else {
          avatarOrb.classList.remove('speaking-pulse');
        }
      }

      function splitTextForGenis(text, lang) {
        const chunks = [];
        const isEnglish = (lang === 'en');
        const maxLength = isEnglish ? 45 : 20;
        let current = "";
        for (let i = 0; i < text.length; i++) {
          current += text[i];
          const char = text[i];
          const isBreakChar = (char === "、" || char === "。" || char === "！" || char === "？" || char === "," || char === "." || char === "!" || char === "?");
          if (current.length >= maxLength || isBreakChar) {
            chunks.push(current.trim());
            current = "";
          }
        }
        if (current) chunks.push(current.trim());
        return chunks.filter(c => c.length > 0);
      }

      function getVoiceForLang(langCode) {
        const voices = availableVoices.length > 0 ? availableVoices : synthesizer.getVoices();
        if (langCode === 'en') {
          return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha'))) || voices.find(v => v.lang.startsWith('en'));
        } else {
          return voices.find(v => v.lang.startsWith('ja') && (v.name.includes('Google') || v.name.includes('Ayumi') || v.name.includes('Haruka') || v.name.includes('Nanami'))) || voices.find(v => v.lang.startsWith('ja'));
        }
      }

      function runAssistantVoice(fullText, lang, suppressSilenceRestart = false, bypassMute = false) {
        if (synthesizer.speaking) synthesizer.cancel();
        const textForSpeech = fullText.replace(/（[^）]*）|\([^)]*\)/g, '').trim();
        const subtitleChunks = splitTextForGenis(fullText, lang);
        const speechChunks = splitTextForGenis(textForSpeech, lang);
        let currentChunkIndex = 0;

        function playNextChunk() {
          if (currentChunkIndex >= subtitleChunks.length && currentChunkIndex >= speechChunks.length) {
            isSpeaking = false;
            if (!suppressSilenceRestart && !isForceMuted) { resetSilenceTimer(); }
            updateAvatarState();
            aiStatusMsg.innerText = isForceMuted ? "MUTED" : "STANDBY";
            aiSubtitleBox.classList.remove('active');
            if (isAutomaticTalk) {
              isEchoWikiLocked = false;
              isAutomaticTalk = false;
            }
            safeStartRecognition();
            return;
          }

          if (currentChunkIndex < subtitleChunks.length) {
            aiSubtitleBox.classList.remove('active');
            setTimeout(() => {
              aiSubtitleBox.innerText = subtitleChunks[currentChunkIndex] || "";
              aiSubtitleBox.classList.add('active');
            }, 150);
          }

          if (currentChunkIndex < speechChunks.length) {
            const utterance = new SpeechSynthesisUtterance(speechChunks[currentChunkIndex]);
            utterance.lang = (lang === 'en') ? 'en-US' : 'ja-JP';
            const targetVoice = getVoiceForLang(lang);
            if (targetVoice) utterance.voice = targetVoice;
            utterance.rate = (lang === 'en') ? 1.05 : 1.15;
            utterance.pitch = (lang === 'en') ? 1.15 : 1.35;

            utterance.onstart = () => {
              isSpeaking = true;
              stopSilenceTimer();
              updateAvatarState();
              aiStatusMsg.innerText = "TALKING";
            };
            utterance.onend = () => {
              currentChunkIndex++;
              playNextChunk();
            };
            synthesizer.speak(utterance);
          } else {
            setTimeout(() => {
              currentChunkIndex++;
              playNextChunk();
            }, 2000);
          }
        }
        playNextChunk();
      }

      function triggerTalk() {
        if (isForceMuted || isSpeaking) return;
        isAutomaticTalk = true;
        const selectedText = getNextText();
        runAssistantVoice(selectedText, currentLang);
      }

      let talkIntervalId = null;
      function resetTalkInterval() {
        if (talkIntervalId) clearInterval(talkIntervalId);
        talkIntervalId = setInterval(() => { triggerTalk(); }, 2 * 60 * 1000);
      }

      let initialPermissionTimer = null;
      function startInitialPermissionTimer() {
        if (initialPermissionTimer) clearTimeout(initialPermissionTimer);
        initialPermissionTimer = setTimeout(() => {
          if (isForceMuted) {
            isWaitingPermissionResponse = true;
            aiStatusMsg.innerText = "WAITING";
            const promptText = (currentLang === 'en') ? "May I speak to you now?" : "話しかけてもいいですか？";
            runAssistantVoice(promptText, currentLang, true, true);
          }
        }, 2 * 60 * 1000);
      }
      startInitialPermissionTimer();

      async function fetchWikipediaSummary(title) {
        const url = `https://ja.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          const pages = data.query.pages;
          const pageId = Object.keys(pages)[0];
          if (pageId !== "-1" && pages[pageId].extract) {
            let extract = pages[pageId].extract;
            if (extract.length > 150) { extract = extract.substring(0, 150) + "…"; }
            return extract;
          }
          return null;
        } catch (e) { return null; }
      }

      let isRecognitionActive = false;
      let voiceRecognition = null;

      const WebKitSpeech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (WebKitSpeech) {
        voiceRecognition = new WebKitSpeech();
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = false;

        voiceRecognition.onstart = () => { isRecognitionActive = true; };
        voiceRecognition.onend = () => { isRecognitionActive = false; };
        voiceRecognition.onerror = () => { isRecognitionActive = false; };

        voiceRecognition.onresult = async (event) => {
          const currentIndex = event.resultIndex;
          const heardPhrase = event.results[currentIndex][0].transcript.trim().toLowerCase();
          const config = langConfig[currentLang];

          let tokenSurfaces = [];
          if (tokenizerInstance) {
            const tokens = tokenizerInstance.tokenize(heardPhrase);
            tokenSurfaces = tokens.map(t => t.surface_form);
          }

          if (isForceMuted && isWaitingPermissionResponse) {
            const isYes = ["はい", "いいよ", "どうぞ", "話して", "喋って", "ok", "yes"].some(kw => heardPhrase.includes(kw) || tokenSurfaces.includes(kw));
            if (isYes) {
              isForceMuted = false;
              isWaitingPermissionResponse = false;
              stopSilenceTimer();
              resetSilenceTimer();
              resetTalkInterval();
              aiStatusMsg.innerText = "STANDBY";
              runAssistantVoice("分かりました！お話ししましょう。", currentLang);
              return;
            } else {
              isWaitingPermissionResponse = false;
              runAssistantVoice("わかりました。ではまた後ほど聞いてみますね。", currentLang, true);
              startInitialPermissionTimer();
              return;
            }
          }

          if (isForceMuted) return;
          resetSilenceTimer();

          const isSC = config.scKeywords.some(keyword => heardPhrase.includes(keyword.toLowerCase()) || tokenSurfaces.includes(keyword.toLowerCase()));
          if (isSC) {
            triggerSuperChatEffects();
            return;
          }

          for (const rule of config.cutInRules) {
            const matched = rule.keywords.some(kw => heardPhrase.includes(kw.toLowerCase()) || tokenSurfaces.includes(kw.toLowerCase()));
            if (matched) {
              executePhraseCutIn(rule.text);
              return;
            }
          }

          const patterns = aiData.patternDict?.[currentLang] || [];
          for (const item of patterns) {
            const regex = new RegExp(item.pattern, "i");
            if (regex.test(heardPhrase)) {
              const responses = item.responses;
              if (responses && responses.length > 0) {
                runAssistantVoice(responses[Math.floor(Math.random() * responses.length)], currentLang);
                return;
              }
            }
          }

          // 4. 攻略Wiki検索の選択待ち判定
          if (isWaitingWikiChoice) {
            isWaitingWikiChoice = false;
            if (heardPhrase.includes('はい') || heardPhrase.includes('教えて') || heardPhrase.includes('yes') || tokenSurfaces.includes('はい') || tokenSurfaces.includes('教えて')) {
              if (pendingWikiResults.length > 0) {
                const topResult = pendingWikiResults[0];
                const snippet = topResult.snippet.replace(/<[^>]*>?/gm, '');
                runAssistantVoice(`「${topResult.title}」のページが見つかりました。概要をお伝えします。${snippet}`, currentLang);
              } else {
                runAssistantVoice("該当するデータが見つかりませんでした。", currentLang);
              }
            } else {
              runAssistantVoice("わかりました。また気になるものがあったら聞いてくださいね。", currentLang);
            }
            pendingWikiResults = [];
            return;
          }

          // 5. ゼルダやモンハンの攻略Wiki検索指示
          const isWikiTarget = Object.keys(wikiRegistry).some(k => heardPhrase.includes(k)) || heardPhrase.includes("攻略") || heardPhrase.includes("wiki");
          if (isWikiTarget && (heardPhrase.includes("調べて") || heardPhrase.includes("教えて") || heardPhrase.includes("の"))) {
            if (voiceRecognition && isRecognitionActive) voiceRecognition.stop();
            runAssistantVoice(`攻略Wikiから調べています...`, currentLang);
            const results = await searchGameWiki(heardPhrase);
            if (results && results.length > 0) {
              pendingWikiResults = results;
              isWaitingWikiChoice = true;
              runAssistantVoice(`「${results[0].title}」などが見つかりました。詳しい内容を聞きますか？`, currentLang);
            } else {
              runAssistantVoice(`指定されたキーワード에該当するページは見つかりませんでした。`, currentLang);
            }
            return;
          }

          // 6. 通常のWikipediaフォールバック
          if (tokenizerInstance && !isEchoWikiLocked) {
            const tokens = tokenizerInstance.tokenize(heardPhrase);
            const validNouns = tokens.filter(t => t.pos === "名詞" && t.pos_detail_1 !== "代名詞" && t.pos_detail_1 !== "非自立" && t.pos_detail_1 !== "数" && t.pos_detail_1 !== "接尾");
            if (validNouns.length > 0) {
              const targetWord = validNouns[validNouns.length - 1].surface_form;
              if (voiceRecognition && isRecognitionActive) { voiceRecognition.stop(); }
              const summary = await fetchWikipediaSummary(targetWord);
              if (summary) {
                isEchoWikiLocked = true;
                runAssistantVoice(`${targetWord}についてですね。Wikipediaで調べてみました。結果を聞きますか？`, currentLang);
              }
              return;
            }
          }
        };

        updateSpeechRecognitionLang();
        setInterval(() => { if (!isRecognitionActive && !isForceMuted) safeStartRecognition(); }, 1000);
      }

      function safeStartRecognition() {
        if (voiceRecognition && !isRecognitionActive && !isSpeaking) {
          try { voiceRecognition.start(); } catch (e) {}
        }
      }

      function updateSpeechRecognitionLang() {
        if (!voiceRecognition) return;
        if (isRecognitionActive) { voiceRecognition.stop(); }
        voiceRecognition.lang = langConfig[currentLang].recognitionLang;
        safeStartRecognition();
      }

      document.body.addEventListener('click', (e) => {
        if (e.target === toggleBtn || e.target === toggleLangBtn) return;
        if (isForceMuted) return;
        unlockAudio();
        safeStartRecognition();
        resetSilenceTimer();
        triggerTalk();
      });
    </script>
  </body>
</html>
